<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
     <div class="container mt-5" id="container1">
        <h1 class="display-1 text-center">Task List Management</h1>
        <div class="div"></div>
        <div class="row">
            <div class="col-md-6 d-grid">
                <label for="task" class="form-label">Task</label>
                <input type="text" class="form-control mb-3" id="myinput" placeholder="Please Enter Your Tasks">
                <button type="button" class="btn btn-primary mb-3"  id="btn_1" onclick="AddNew()">Add Task</button>
                <button type="button" class="btn btn-primary mb-3" id="btn_2">Clear Task</button>
            </div>
            <div class="col-md-6 border result">
                <h2 class="text-center">Task List</h2>
                <ul class="list-group mb-3" id="myul">
                    <li class="list-group-item"style="display:flex; justify-content:space-between;align-items-center">Travelling</li>
                    <li class="list-group-item"style="display:flex; justify-content:space-between;align-items-center">Coding</li>
                    <li class="list-group-item"style="display:flex; justify-content:space-between;align-items-center">Shopping</li>
                </ul>
            </div>
        </div>

     </div>
</body>
</html>
